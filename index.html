<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ciyoucu 考核体系</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236E4FD1'/%3E%3Cpath d='M20.5 11.2a6.2 6.2 0 1 0 0 9.6' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#FDF8F4; --surface:#fff; --ink:#332B45; --muted:#7D7492; --line:#F0E7DC;
  --plum:#8A66D8; --plum-2:#B79BF0; --plum-soft:#F2EBFF;
  --mint:#35BFA0; --mint-soft:#E3F8F2;
  --rose:#F0719B; --rose-soft:#FFE9F0;
  --amber:#EFA24C; --amber-soft:#FFF1DE;
  --shadow:0 2px 6px rgba(70,48,96,.05), 0 14px 30px -18px rgba(70,48,96,.42);
  --r:20px;
}
html,body{margin:0;padding:0}
body{
  color:var(--ink);font-size:15px;line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:
    radial-gradient(820px 420px at 6% -6%, #FFEFF5 0%, rgba(255,239,245,0) 62%),
    radial-gradient(760px 420px at 104% 2%, #E8F8F4 0%, rgba(232,248,244,0) 60%),
    radial-gradient(900px 520px at 50% 108%, #F3EEFF 0%, rgba(243,238,255,0) 65%),
    var(--bg);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
body::before,body::after{content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:-1}
body::before{width:160px;height:160px;left:-46px;top:20%;background:radial-gradient(circle at 35% 35%,#FFD7E6,rgba(255,215,230,0) 72%);animation:float 9s ease-in-out infinite}
body::after{width:200px;height:200px;right:-64px;top:56%;background:radial-gradient(circle at 60% 40%,#CFEDE4,rgba(207,237,228,0) 72%);animation:float 12s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-22px) scale(1.06)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-3deg)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes fall{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(96vh) rotate(540deg);opacity:.9}}
#app{max-width:560px;margin:0 auto;padding:18px 16px 44px;min-height:100vh}
.brandrow{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.mark{width:42px;height:42px;border-radius:15px;background:linear-gradient(145deg,var(--plum),#B99BF2);display:grid;place-items:center;flex:none;color:#fff;box-shadow:0 10px 20px -10px rgba(138,102,216,.95);animation:bob 3.4s ease-in-out infinite}
.brandtxt{font-weight:800;letter-spacing:.01em;font-size:15.5px}
.brandsub{font-size:11.5px;color:var(--muted);margin-top:1px}
.chip{margin-left:auto;font-size:11px;padding:6px 11px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.85);color:var(--muted);cursor:pointer;backdrop-filter:blur(6px);transition:transform .18s ease}
.chip:active{transform:scale(.94)}
.chip.ok{color:#1E8A72;border-color:#CFEDE3;background:linear-gradient(135deg,#E6FAF4,#F3FFFB)}
.hero{position:relative;margin:2px 0 20px;padding:20px 18px 18px;border-radius:24px;overflow:hidden;
  background:linear-gradient(150deg,#FFFFFF 0%,#FBF6FF 55%,#F2FFF9 100%);
  border:1px solid #F3E9F7;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-28px;top:-34px;width:118px;height:118px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#E7DCFF,rgba(231,220,255,0) 70%)}
.hero h1{font-size:26px;line-height:1.25;margin:0 0 8px;letter-spacing:-.015em;font-weight:800}
.hero p{margin:0;color:var(--muted);font-size:13.5px}
.grid{display:grid;gap:11px}
.grid.enter .card{animation:rise .42s cubic-bezier(.2,.7,.3,1) both}
.grid.enter .card:nth-child(2){animation-delay:.05s}
.grid.enter .card:nth-child(3){animation-delay:.1s}
.grid.enter .card:nth-child(4){animation-delay:.15s}
.grid.enter .card:nth-child(5){animation-delay:.2s}
.card{
  display:flex;align-items:center;gap:13px;background:rgba(255,255,255,.92);border:1px solid var(--line);
  border-radius:var(--r);padding:15px 15px;box-shadow:var(--shadow);cursor:pointer;
  transition:transform .18s cubic-bezier(.2,.8,.3,1), box-shadow .18s ease, border-color .18s ease;
}
.card:hover{transform:translateY(-2px);box-shadow:0 18px 32px -20px rgba(70,48,96,.6);border-color:#EADCF6}
.card:active{transform:scale(.97)}
.icn{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none}
.icn svg{width:22px;height:22px}
.icn.p{background:linear-gradient(135deg,#F2EBFF,#E3D6FF);color:var(--plum)}
.icn.m{background:linear-gradient(135deg,#E3F8F2,#CFF3E9);color:#20A183}
.icn.a{background:linear-gradient(135deg,#FFF1DE,#FFE4C4);color:#CE8A32}
.icn.r{background:linear-gradient(135deg,#FFE9F0,#FFD7E4);color:#D9537E}
.card .tt{font-weight:750;font-size:15.5px}
.card .ds{font-size:12.5px;color:var(--muted);margin-top:2px}
.chev{margin-left:auto;color:#C9C0DC;flex:none;transition:transform .18s ease}
.card:hover .chev{transform:translateX(2px);color:var(--plum)}
.h2{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.06em;margin:24px 0 10px}
.field{margin-bottom:13px}
.lb{font-size:12.5px;color:var(--muted);margin-bottom:6px;display:block;font-weight:600}
input,textarea,select{
  width:100%;font-size:16px;font-family:inherit;color:var(--ink);background:#fff;
  border:1.5px solid var(--line);border-radius:15px;padding:12px 14px;outline:none;
  transition:border-color .18s ease, box-shadow .18s ease;
}
input:focus,textarea:focus,select:focus{border-color:var(--plum);box-shadow:0 0 0 4px rgba(138,102,216,.13)}
textarea{min-height:110px;resize:vertical;line-height:1.55}
.btn{
  display:block;width:100%;border:0;border-radius:16px;padding:14px 16px;font-size:15.5px;font-weight:750;
  font-family:inherit;color:#fff;cursor:pointer;margin-top:6px;letter-spacing:.01em;
  background:linear-gradient(135deg,#9270E4,#7A55D2);
  box-shadow:0 12px 22px -14px rgba(122,85,210,.95);
  transition:transform .16s cubic-bezier(.2,.8,.3,1), box-shadow .16s ease, filter .16s ease;
}
.btn:hover{filter:brightness(1.04);box-shadow:0 16px 26px -14px rgba(122,85,210,.9)}
.btn:active{transform:scale(.975)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:#E4D8F2}
.btn.mint{background:linear-gradient(135deg,#42CBA8,#25AE8E);box-shadow:0 12px 22px -14px rgba(37,174,142,.95)}
.btn.rose{background:linear-gradient(135deg,#FF85AC,#E85C89);box-shadow:0 12px 22px -14px rgba(232,92,137,.95)}
.btn.sm{padding:10px 14px;font-size:13px;width:auto;border-radius:13px;margin:0}
.btn:disabled{opacity:.45}
.row{display:flex;gap:9px;align-items:center}
.row.wrap{flex-wrap:wrap}
.note{background:rgba(255,255,255,.88);border:1.5px dashed #EADFF5;border-radius:16px;padding:13px 14px;font-size:12.5px;color:var(--muted);line-height:1.7}
.note b{color:var(--ink)}
.err{color:#DE4D77;font-size:13px;margin-top:9px;min-height:18px}
.tag{display:inline-block;font-size:11px;padding:4px 9px;border-radius:9px;background:var(--plum-soft);color:var(--plum);font-weight:750}
.tag.m{background:var(--mint-soft);color:#1E8A72}
.tag.r{background:var(--rose-soft);color:#D9537E}
.tag.a{background:var(--amber-soft);color:#C57F26}
.seg{display:flex;gap:5px;background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:16px;padding:5px;overflow:auto}
.seg button{
  flex:1;min-width:max-content;border:0;background:transparent;font-family:inherit;font-size:13.5px;
  padding:10px 12px;border-radius:12px;color:var(--muted);cursor:pointer;font-weight:700;
  transition:all .18s ease;
}
.seg button.on{background:#fff;color:var(--plum);box-shadow:0 6px 14px -8px rgba(70,48,96,.5)}
.listcard{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:18px;padding:13px 15px;margin-bottom:10px;box-shadow:0 2px 10px -8px rgba(70,48,96,.4)}
.lrow{display:flex;align-items:center;gap:10px}
.lname{font-weight:750;font-size:14.5px}
.lmeta{font-size:12px;color:var(--muted);margin-top:2px}
.qa{margin-left:auto;display:flex;gap:7px;flex:none}
.mini{font-size:11.5px;border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:11px;padding:7px 11px;cursor:pointer;font-family:inherit;font-weight:700;transition:all .16s ease}
.mini:active{transform:scale(.94)}
.mini.on{border-color:var(--rose);color:#D9537E;background:var(--rose-soft)}
.mini.ok{border-color:var(--mint);color:#1E8A72;background:var(--mint-soft)}
.qcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.qnum{font-size:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,#A98AF0,#8A66D8);padding:3px 10px;border-radius:999px}
.qstem{font-size:15.5px;line-height:1.65;margin:0 0 12px;font-weight:600}
.opt{position:relative;display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);background:#FCFAF8;border-radius:15px;padding:12px 13px;margin-bottom:8px;cursor:pointer;font-size:14.5px;transition:all .16s cubic-bezier(.2,.8,.3,1)}
.opt:active{transform:scale(.985)}
.opt.on{border-color:var(--plum);background:linear-gradient(135deg,#F6F1FF,#EFE6FF);box-shadow:0 8px 18px -14px rgba(138,102,216,.9)}
.opt.on::after{content:"✓";position:absolute;right:12px;top:50%;transform:translateY(-50%);font-weight:800;color:var(--plum);font-size:14px}
.opt .k{font-weight:800;color:var(--muted);flex:none}
.opt.on .k{color:var(--plum)}
.ansbox{background:var(--mint-soft);border:1px solid #CDE9DF;border-radius:15px;padding:11px 13px;font-size:13.5px;color:#12624F;line-height:1.65}
.userbox{background:#FCFAF8;border:1px solid var(--line);border-radius:15px;padding:11px 13px;font-size:13.5px;line-height:1.65;white-space:pre-wrap}
.kv{font-size:11.5px;color:var(--muted);margin-bottom:5px;letter-spacing:.04em;font-weight:700}
.table{width:100%;border-collapse:collapse;table-layout:fixed;background:#fff;border-radius:16px;overflow:hidden;font-size:13px}
.table th,.table td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);word-break:break-all}
.table th{font-size:11.5px;color:var(--muted);font-weight:700;background:#FCF9F6}
.table td:last-child,.table th:last-child{text-align:right}
.big{font-size:36px;font-weight:850;letter-spacing:-.02em;margin:0;animation:pop .5s cubic-bezier(.2,.8,.3,1) both}
.footer{margin-top:30px;text-align:center;font-size:11.5px;color:#A9A0BC}
.bar{position:sticky;bottom:0;background:linear-gradient(to top,rgba(253,248,244,.96) 62%,rgba(253,248,244,0));padding:14px 0 4px;margin-top:8px}
pre.sql{background:#2C2440;color:#E9E2FA;font-size:11.5px;line-height:1.65;padding:14px;border-radius:16px;overflow:auto;max-height:260px;font-family:ui-monospace,Menlo,Consolas,monospace}
.back{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);cursor:pointer;margin-bottom:14px;background:none;border:0;padding:0;font-family:inherit;font-weight:600}
.back:active{opacity:.7}
.hr{height:1px;background:var(--line);margin:18px 0}
.center{text-align:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mint);display:inline-block;vertical-align:middle;margin-right:5px;box-shadow:0 0 0 3px rgba(53,191,160,.16)}
.prog{position:sticky;top:0;z-index:5;margin:-4px 0 14px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.92);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.progtrack{height:8px;border-radius:99px;background:#F0EAF8;overflow:hidden}
.progtrack i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#B79BF0,#8A66D8,#35BFA0);transition:width .3s cubic-bezier(.2,.8,.3,1)}
.progtxt{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:6px;font-weight:700}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:99}
.confetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:3px;animation:fall 2.4s linear forwards}
@media (min-width:700px){
  #app{padding-top:34px}
  .hero h1{font-size:30px}
}
@media (prefers-reduced-motion:reduce){
  .mark,body::before,body::after{animation:none}
  .grid.enter .card{animation:none}
}

/* ---- 追加动效 ---- */
@keyframes pagein{from{opacity:.55;transform:translateY(8px) scale(.995)}to{opacity:1;transform:none}}
#app.pagein{animation:pagein .34s cubic-bezier(.2,.8,.3,1) both}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);transform:skewX(-18deg);animation:shine 3.8s ease-in-out infinite}
@keyframes shine{0%,70%{left:-60%}100%{left:135%}}
.btn.ghost::after{display:none}
.progtrack i{background-image:linear-gradient(90deg,#B79BF0,#8A66D8,#35BFA0,#B79BF0);background-size:220% 100%;animation:flow 2.6s linear infinite}
@keyframes flow{from{background-position:0 0}to{background-position:220% 0}}
.mascot{position:absolute;right:8px;top:2px;width:78px;height:78px;pointer-events:none;animation:bob 3.6s ease-in-out infinite}
.mascot svg{width:100%;height:100%}
.icn{transition:transform .22s cubic-bezier(.2,.8,.3,1)}
.card:hover .icn{transform:rotate(-6deg) scale(1.07)}
.h2::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--plum-2);margin-right:7px;vertical-align:middle}
.tag.m{animation:pop .45s cubic-bezier(.2,.8,.3,1) both}
@media (prefers-reduced-motion:reduce){
  #app.pagein{animation:none}
  .btn::after,.progtrack i,.mascot{animation:none}
}
</style>

<body>
<div id="app"></div>
<script>
/* ================= 配置 ================= */
const CFG_KEY = 'ciyoucu_cfg_v3';
const ROOM_ID = 'main';
const CREATE_SQL = 'create table if not exists room (id text primary key, doc jsonb, updated_at timestamptz default now());';
const DEFAULT_URL = 'https://mtsghonyvdaripocdhbj.supabase.co';
const DEFAULT_KEY = 'sb_publishable_0sCNLUlLMHa8N-LcQtyz_w_hIUfPK0a';
const cfg = { mode:'cloud', url:DEFAULT_URL, key:DEFAULT_KEY };
try {
  const s = JSON.parse(localStorage.getItem(CFG_KEY) || '{}');
  if (s && typeof s.url === 'string') {
    cfg.url = s.url; cfg.key = s.key || '';
    cfg.mode = (cfg.url && cfg.key) ? 'cloud' : 'local';
  }
} catch (e) {}
function saveCfg(url, key) {
  cfg.url = (url || '').trim().replace(/\/+$/, '');
  cfg.key = (key || '').trim();
  cfg.mode = (cfg.url && cfg.key) ? 'cloud' : 'local';
  localStorage.setItem(CFG_KEY, JSON.stringify({ url: cfg.url, key: cfg.key }));
}
function useLocal() {
  cfg.mode = 'local'; cfg.url = ''; cfg.key = '';
  localStorage.setItem(CFG_KEY, JSON.stringify({ url:'', key:'' }));
}
const isShared = () => cfg.mode === 'cloud' && !!cfg.url && !!cfg.key;

function lsGet(k, d) { try { const v = localStorage.getItem('cx_' + k); return v ? JSON.parse(v) : d; } catch(e) { return d; } }
function lsSet(k, v) { localStorage.setItem('cx_' + k, JSON.stringify(v)); }

/* ================= 云端接口 ================= */
async function sb(path, opts) {
  opts = opts || {};
  const headers = Object.assign({
    'apikey': cfg.key,
    'Authorization': 'Bearer ' + cfg.key,
    'Content-Type': 'application/json'
  }, opts.headers || {});
  const res = await fetch(cfg.url + '/rest/v1/' + path, Object.assign({}, opts, { headers }));
  if (!res.ok) {
    let t = '';
    try { t = await res.text(); } catch(e) {}
    throw new Error('云端返回 ' + res.status + (t ? ('：' + t.slice(0, 140)) : ''));
  }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

/* ================= 数据文档 ================= */
function blankDoc() {
  return { leaders:[], assistants:[], exams:[], questions:[], settings:{}, seq:{ leader:1, assistant:1, question:1, exam:1 } };
}
function normDoc(d) {
  if (!d || typeof d !== 'object') d = blankDoc();
  ['leaders','assistants','exams','questions'].forEach(function (k) { if (!Array.isArray(d[k])) d[k] = []; });
  if (!d.settings || typeof d.settings !== 'object') d.settings = {};
  if (!d.seq || typeof d.seq !== 'object') d.seq = { leader:1, assistant:1, question:1, exam:1 };
  ['leader','assistant','question','exam'].forEach(function (k) { if (!d.seq[k]) d.seq[k] = 1; });
  return d;
}
function readLocalDoc() { try { return normDoc(JSON.parse(localStorage.getItem('cx_doc') || 'null')); } catch(e) { return blankDoc(); } }
function writeLocalDoc(d) { localStorage.setItem('cx_doc', JSON.stringify(d)); }

async function readCloudDoc() {
  const rows = await sb('room?select=doc&id=eq.' + ROOM_ID);
  if (rows && rows[0] && rows[0].doc) return normDoc(rows[0].doc);
  return blankDoc();
}
async function writeCloudDoc(d) {
  await sb('room', {
    method:'POST',
    headers:{ 'Prefer':'resolution=merge-duplicates' },
    body: JSON.stringify([{ id: ROOM_ID, doc: d }])
  });
}
async function loadDoc() { return isShared() ? await readCloudDoc() : readLocalDoc(); }
async function saveDoc(d) { if (isShared()) await writeCloudDoc(d); else writeLocalDoc(d); }

let chain = Promise.resolve();
function serial(fn) {
  const p = chain.then(fn, fn);
  chain = p.catch(function () {});
  return p;
}
function seedDoc(d) {
  if (d.questions && d.questions.length) return false;
  BANK_SEED.forEach(function (q, i) { d.questions.push(Object.assign({}, q, { id: i + 1 })); });
  d.seq.question = BANK_SEED.length + 1;
  return true;
}
async function tx(fn) {
  return serial(async function () {
    const d = await loadDoc();
    seedDoc(d);
    const res = await fn(d);
    if (!(res && res.skip)) await saveDoc(d);
    if (res && typeof res === 'object' && Object.prototype.hasOwnProperty.call(res, 'value')) return res.value;
    return res;
  });
}
async function ro(fn) {
  return serial(async function () {
    const d = await loadDoc();
    seedDoc(d);
    return fn(d);
  });
}

/* ================= 数据访问层 ================= */
const store = {
  async getSettings() { return await ro(function (d) { return d.settings; }); },
  async setSetting(k, v) { return tx(function (d) { d.settings[k] = String(v); }); },

  async listLeaders() {
    return await ro(function (d) { return d.leaders.slice().sort(function (a, b) { return Number(a.id) - Number(b.id); }); });
  },
  async addLeader(name, qq) {
    return tx(function (d) {
      if (d.leaders.some(function (x) { return String(x.qq) === String(qq); })) throw new Error('这个 QQ 号已经录入过了');
      const item = { id: d.seq.leader++, name: name, qq: String(qq), created_at: new Date().toISOString() };
      d.leaders.push(item);
      return { value: item };
    });
  },
  async delLeader(id) {
    return tx(function (d) {
      const n = Number(id);
      d.leaders = d.leaders.filter(function (x) { return Number(x.id) !== n; });
      d.assistants = d.assistants.filter(function (x) { return Number(x.leader_id) !== n; });
    });
  },

  async listAssistants(leaderId) {
    return await ro(function (d) {
      return leaderId ? d.assistants.filter(function (x) { return Number(x.leader_id) === Number(leaderId); }) : d.assistants.slice();
    });
  },
  async addAssistant(leaderId, leaderName, name, qq) {
    return tx(function (d) {
      if (d.assistants.some(function (x) { return String(x.qq) === String(qq); })) throw new Error('这个 QQ 号已经录入过了');
      const item = { id: d.seq.assistant++, leader_id: Number(leaderId), leader_name: leaderName, name: name, qq: String(qq), created_at: new Date().toISOString() };
      d.assistants.push(item);
      return { value: item };
    });
  },
  async delAssistant(id) {
    return tx(function (d) {
      const n = Number(id);
      d.assistants = d.assistants.filter(function (x) { return Number(x.id) !== n; });
    });
  },

  async listQuestions(bank) {
    return await ro(function (d) {
      return d.questions.filter(function (q) { return q.bank === bank; }).sort(function (a, b) { return Number(a.sort) - Number(b.sort); });
    });
  },
  async addQuestion(q) {
    return tx(function (d) {
      const item = Object.assign({}, q, { id: d.seq.question++ });
      d.questions.push(item);
      return { value: item };
    });
  },
  async updateQuestion(id, patch) {
    return tx(function (d) {
      const it = d.questions.find(function (x) { return Number(x.id) === Number(id); });
      if (it) Object.assign(it, patch);
    });
  },
  async delQuestion(id) {
    return tx(function (d) {
      const n = Number(id);
      d.questions = d.questions.filter(function (x) { return Number(x.id) !== n; });
    });
  },

  async listExams(leaderId) {
    return await ro(function (d) {
      const list = d.exams.slice().reverse();
      return leaderId ? list.filter(function (x) { return Number(x.leader_id) === Number(leaderId); }) : list;
    });
  },
  async addExam(rec) {
    return tx(function (d) {
      const item = Object.assign({}, rec, { id: d.seq.exam++, uid: 'x' + Date.now() + Math.random().toString(36).slice(2, 7), created_at: new Date().toISOString() });
      d.exams.push(item);
      return { value: item };
    });
  },
  async importExams(list) {
    return tx(function (d) {
      let n = 0;
      list.forEach(function (r) {
        if (!r || !r.uid) return;
        if (d.exams.some(function (e) { return e.uid === r.uid; })) return;
        d.exams.push(r); n++;
      });
      return { value: n };
    });
  },

  async initSeed() {
    const d = await loadDoc();
    if (seedDoc(d)) await saveDoc(d);
  }
};

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function enc(str) { return btoa(unescape(encodeURIComponent(str))); }
function dec(str) { return decodeURIComponent(escape(atob(str))); }
function fmtTime(t) {
  if (!t) return '';
  const d = new Date(t);
  if (isNaN(d.getTime())) return String(t);
  const p = n => (n < 10 ? '0' : '') + n;
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function el(id) { return document.getElementById(id); }
function val(id) { const e = el(id); return e ? e.value.trim() : ''; }

function render() {

  }
  if (state.view === 'exam') updateProg();
  if (state.view === 'result' && state.result && state.result.passed) confetti();
}

function answeredCount(ex) {
  return ex.questions.filter(function (q, i) {
    const a = ex.answers[i];
    if (q.qtype === 'fill') return Array.isArray(a) && a.some(function (x) { return String(x == null ? '' : x).trim(); });
    return String(a == null ? '' : a).trim().length > 0;
  }).length;
}
function updateProg() {
  const ex = state.exam; if (!ex) return;
  const bar = document.getElementById('progBar'), txt = document.getElementById('progTxt');
  if (!bar || !txt) return;
  const n = answeredCount(ex), t = ex.questions.length || 1;
  bar.style.width = Math.round(n / t * 100) + '%';
  txt.textContent = '已答 ' + n + ' / ' + ex.questions.length;
}
function confetti() {
  try {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const d = document.createElement('div');
    d.className = 'confetti'; d.setAttribute('aria-hidden', 'true');
    const cols = ['#8A66D8', '#F0719B', '#35BFA0', '#EFA24C', '#B79BF0'];
    for (let i = 0; i < 30; i++) {
      const sp = document.createElement('i');
      sp.style.left = (Math.random() * 100).toFixed(1) + '%';
      sp.style.background = cols[i % cols.length];
      sp.style.animationDelay = (Math.random() * 0.9).toFixed(2) + 's';
      sp.style.animationDuration = (1.9 + Math.random() * 1.1).toFixed(2) + 's';
      d.appendChild(sp);
    }
    document.body.appendChild(d);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 3600);
  } catch (e) {}
}

function qBody(q, i, answers, reading) {
  let h = '';
  if (q.qtype === 'single') {
    (q.options || []).forEach((o, k) => {
      const key = String.fromCharCode(65 + k);
      const on = answers[i] === key ? ' on' : '';
      h += '<div class="opt' + on + '" ' + (reading ? '' : ('data-act="pick" data-i="' + i + '" data-k="' + key + '"')) + '><span class="k">' + key + '</span><span>' + esc(o) + '</span></div>';
    });
  } else if (q.qtype === 'judge') {
    ['对','错'].forEach(k => {
      const on = answers[i] === k ? ' on' : '';
      h += '<div class="opt' + on + '" ' + (reading ? '' : ('data-act="pick" data-i="' + i + '" data-k="' + k + '"')) + '><span class="k">' + k + '</span></div>';
    });
  } else if (q.qtype === 'fill') {
    const n = Math.max(1, Number(q.blanks) || 1);
    const cur = Array.isArray(answers[i]) ? answers[i] : [];
    h += '<div class="row wrap">';
    for (let j = 0; j < n; j++) {
      h += '<input style="flex:1;min-width:120px;margin-bottom:8px" ' + (reading ? 'disabled value="' + esc(cur[j] || '') + '"' : ('data-ans-i="' + i + '" data-ans-j="' + j + '" value="' + esc(cur[j] || '') + '" placeholder="第' + (j+1) + '空"')) + '>';
    }
    h += '</div>';
  } else {
    h += '<textarea' + (reading ? ' disabled' : ' data-ans-i="' + i + '"') + ' placeholder="写答案">' + esc(answers[i] || '') + '</textarea>';
  }
  return h;
}

          + '<button class="mini ' + (j === false ? 'on' : '') + '" data-act="judge" data-i="' + i + '" data-v="0">答错</button>'

function fmtAnswer(q, a) {
  if (a == null) return '';
  if (Array.isArray(a)) return a.filter(x => x && x.trim()).join(' ／ ');
  return String(a);

/* ================= 业务动作 ================= */
function fail(msg) {
  const e = el('err');
  if (e) { e.textContent = msg; }
  else { window.alert(msg); }
}

async function loadTab() {
  if (state.view === 'owner') {
    if (state.tab === 'leaders' || state.tab === 'exams') state.leaders = await store.listLeaders();
    if (state.tab === 'leaders') state.assistants = await store.listAssistants();
    if (state.tab === 'exams') state.exams = await store.listExams();
    if (state.tab === 'bank') state.questions = await store.listQuestions(state.qbank);
  } else if (state.view === 'leader') {
    const a = state.actor;
    if (state.tab === 'assist') state.assistants = await store.listAssistants(a.leaderId);
    else state.exams = await store.listExams(a.leaderId);
  } else if (state.view === 'assistant') {
    state.exams = await store.listExams(state.actor.leaderId);
  }
}

async function buildExam(type) {
  let qs = [], paper = '';
  if (type === 'jump') {
    const all = await store.listQuestions('J');
    const n = Math.min(6 + Math.floor(Math.random() * 3), all.length);
    const picked = all.slice().sort(() => Math.random() - 0.5).slice(0, n);
    qs = picked.map(q => ({ id:q.id, stem:q.stem, qtype:q.qtype, options:q.options || [], answer:q.answer, blanks:Number(q.blanks) || 0 }));
    paper = '跳培随机卷 ' + qs.length + ' 题';
  } else {
    const banks = ['A','B','C'];
    const b = banks[Math.floor(Math.random() * 3)];
    const all = await store.listQuestions(b);
    qs = all.map(q => ({ id:q.id, stem:q.stem, qtype:q.qtype, options:q.options || [], answer:q.answer, blanks:Number(q.blanks) || 0 }));
    paper = BANK_NAME[b];
  }
  if (!qs.length) throw new Error('这个题库还是空的，请先到团长后台的题库管理里补题');
  return {
    type: type, paper: paper, questions: qs,
    answers: qs.map(q => q.qtype === 'fill' ? new Array(Math.max(1, q.blanks)).fill('') : ''),
    judged: qs.map(() => null)
  };
}

function autoJudge(q, ans) {
  if (q.qtype === 'single') return String(ans || '').trim() === String(q.answer || '').trim();
  if (q.qtype === 'judge') {
    let a = String(ans || '').trim();
    if (a === '√') a = '对';
    if (a === '×') a = '错';
    return a === String(q.answer || '').trim();
  }
  return null;
}

async function handle(act, el2) {
  switch (act) {
    /* --- 导航 --- */
    case 'home': state.view = 'home'; state.actor = null; render(); return;
    case 'backHome': state.view = 'home'; state.actor = null; state.result = null; render(); return;
    case 'setup': state.view = 'setup'; render(); return;
    case 'loginOwner': state.view = 'loginOwner'; render(); return;
    case 'loginLeader': state.view = 'loginLeader'; render(); return;
    case 'loginAssistant': state.view = 'loginAssistant'; render(); return;

    /* --- 同步设置 --- */
    case 'copySql': {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try { await navigator.clipboard.writeText(CREATE_SQL); window.alert('已复制，去 Supabase 的 SQL Editor 粘进去点 Run'); return; } catch (e) {}
      }
      window.alert(CREATE_SQL);
      return;
    }
    case 'saveCfg': {
      const u = val('cfgUrl'), k = val('cfgKey');
      if (!u || !k) { fail('两个都要填'); return; }
      saveCfg(u, k);
      try {
        await readCloudDoc();
        await store.initSeed();
        window.alert('同步成功，多台手机现在能看到同一份成绩');
        state.view = 'home'; render();
      } catch (e) {
        useLocal();
        window.alert('连不上：' + e.message + '\n\n检查 URL、key 有没有复制全，以及那句建表 SQL 有没有跑成功。');
        state.view = 'setup'; render();
      }
      return;
    }
    case 'useLocal': {
      useLocal();
      window.alert('已切回本机模式：成绩只存在这台手机上');
      state.view = 'home'; render(); return;
    }

    /* --- 成绩码 --- */
    case 'openExport': {
      const a = state.actor;
      const list = await store.listExams(a && a.leaderId ? a.leaderId : null);
      if (!list.length) { window.alert('还没有成绩可以导出'); return; }
      state.shareData = enc(JSON.stringify(list));
      state.shareMode = 'export'; state.view = 'share'; render(); return;
    }
    case 'openImport':
      state.shareMode = 'import'; state.view = 'share'; render(); return;
    case 'copyShare': {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try { await navigator.clipboard.writeText(state.shareData || ''); window.alert('已复制，直接发给组长'); return; } catch (e) {}
      }
      window.alert('长按文本框全选复制即可');
      return;
    }
    case 'doImport': {
      const raw = val('importBox').replace(/\s+/g, '');
      if (!raw) { fail('先粘贴成绩码'); return; }
      let arr;
      try { arr = JSON.parse(dec(raw)); } catch (e) { fail('这串不是有效的成绩码，检查有没有复制全'); return; }
      if (!Array.isArray(arr)) { fail('成绩码格式不对'); return; }
      const n = await store.importExams(arr);
      window.alert('导入完成，新增 ' + n + " 条成绩");
      state.view = 'home'; state.actor = null; render(); return;
    }

    /* --- 登录 --- */
    case 'doOwnerLogin': {
      const acc = val('ownerAcc'), pwd = val('pwdInput');
      if (!acc) { fail('请输入团长账号'); return; }
      if (!pwd) { fail('请输入密码'); return; }
      const s = await store.getSettings();
      const realQq = String(s.owner_qq || '201005194006');
      const realPwd = String(s.owner_pwd || 'bo05194006');
      if (acc !== realQq) { fail('团长账号不对'); return; }
      if (pwd !== realPwd) { fail('密码不对'); return; }
      state.actor = { role:'owner', name:'团长' };
      state.view = 'owner'; state.tab = 'leaders';
      await loadTab(); render(); return;
    }
    case 'doLeaderLogin': {
      const qq = val('qqInput');
      if (!qq) { fail('请输入 QQ 号'); return; }
      const list = await store.listLeaders();
      const hit = list.find(x => String(x.qq).trim() === qq);
      if (!hit) { fail('这个 QQ 号还没被团长录入，请联系团长'); return; }
      state.actor = { role:'leader', leaderId: hit.id, leaderName: hit.name, name: hit.name, qq: String(hit.qq) };
      state.view = 'leader'; state.tab = 'assist';
      await loadTab(); render(); return;
    }
    case 'doAssistLogin': {
      const qq = val('qqInput');
      if (!qq) { fail('请输入 QQ 号'); return; }
      const all = await store.listAssistants();
      const hit = all.find(x => String(x.qq).trim() === qq);
      if (!hit) { fail('这个 QQ 号还没被组长录入，请联系你的组长'); return; }
      state.actor = { role:'assistant', leaderId: hit.leader_id, leaderName: hit.leader_name, name: hit.name, qq: String(hit.qq) };
      state.view = 'assistant';
      await loadTab(); render(); return;
    }
    case 'logout': case 'logoutOwner':
      state.actor = null; state.view = 'home'; render(); return;

    /* --- 考核入口 --- */
    case 'examEntry': state.pendingType = el2.dataset.type; state.view = 'verify'; render(); return;
    case 'doVerify': {
      const qq = val('qqInput');
      if (!qq) { fail('请输入 QQ 号'); return; }
      const ls = await store.listLeaders();
      const leader = ls.find(x => String(x.qq).trim() === qq);
      if (leader) {
        state.actor = { role:'leader', leaderId: leader.id, leaderName: leader.name, name: leader.name, qq: String(leader.qq) };
      } else {
        const as = await store.listAssistants();
        const hit = as.find(x => String(x.qq).trim() === qq);
        if (!hit) { fail('这个 QQ 号没有被录入，组长找团长、小助理找组长'); return; }
        state.actor = { role:'assistant', leaderId: hit.leader_id, leaderName: hit.leader_name, name: hit.name, qq: String(hit.qq) };
      }
      state.examType = state.pendingType;
      state.view = 'examPrep'; render(); return;
    }
    case 'startNew': state.examType = el2.dataset.type; state.view = 'examPrep'; render(); return;
    case 'startExam': {
      const n = val('mName'), q = val('mQq');
      if (!n) { fail('写一下组员名字'); return; }
      if (!q) { fail('写一下组员 QQ 号'); return; }
      const ex = await buildExam(state.examType);
      ex.memberName = n; ex.memberQq = q; ex.graderName = state.actor.name;
      state.exam = ex; state.view = 'exam'; render(); return;
    }

    /* --- 答题 --- */
    case 'pick': {
      const i = Number(el2.dataset.i), k = el2.dataset.k;
      if (!state.exam) return;
      state.exam.answers[i] = k;
      const card = el2.closest('.qcard');
      if (card) card.querySelectorAll('.opt').forEach(o => o.classList.remove('on'));
      el2.classList.add('on');
      updateProg();
      return;
    }
    case 'submitExam': {
      const ex = state.exam; if (!ex) return;
      let blank = 0;
      ex.questions.forEach((q, i) => {
        if (q.qtype === 'single' || q.qtype === 'judge') { if (!ex.answers[i]) blank++; }
        else if (q.qtype === 'fill') { const arr = ex.answers[i] || []; if (!arr.some(x => String(x).trim())) blank++; }
        else { if (!String(ex.answers[i] || '').trim()) blank++; }
      });
      if (blank > 0 && !window.confirm('还有 ' + blank + ' 道题没作答，确定提交吗？（没答的会按错处理，但要你手工点）')) return;
      ex.judged = ex.questions.map((q, i) => autoJudge(q, ex.answers[i]));
      state.view = 'grade'; render(); return;
    }
    case 'judge': {
      const i = Number(el2.dataset.i);
      if (!state.exam) return;
      state.exam.judged[i] = el2.dataset.v === '1';
      render(); return;
    }
    case 'submitGrade': {
      const ex = state.exam; if (!ex) return;
      const left = ex.judged.filter(v => v === null || v === undefined).length;
      if (left > 0) { fail('还有 ' + left + ' 道题没判，判完才能保存成绩'); return; }
      const wrong = ex.judged.filter(v => v === false).length;
      const passed = wrong <= 2;
      const a = state.actor;
      const rec = {
        leader_id: a.leaderId, leader_name: a.leaderName,
        assistant_name: a.name,
        member_name: ex.memberName, member_qq: ex.memberQq,
        exam_type: ex.type, paper: ex.paper, total: ex.questions.length,
        wrong: wrong, passed: passed,
        grader: (a.role === 'leader' ? '组长·' : '小助理·') + a.name,
        detail: ex.questions.map((q, i) => ({
          stem: q.stem, qtype: q.qtype, answer: q.answer,
          member: fmtAnswer(q, ex.answers[i]),
          ok: ex.judged[i] === true
        }))
      };
      try { await store.addExam(rec); } catch (e) { fail('成绩没存上：' + e.message); return; }
      state.result = Object.assign({ created_at: new Date().toISOString() }, rec);
      state.exam = null;
      state.view = 'result'; render(); return;
    }

    /* --- 后台切换 --- */
    case 'otab': state.tab = el2.dataset.tab; await loadTab(); render(); return;
    case 'ltab': state.tab = el2.dataset.tab; await loadTab(); render(); return;

    /* --- 团长：组长 --- */
    case 'addLeader': {
      const name = val('nlName'), qq = val('nlQq');
      if (!name || !qq) { fail('名字和 QQ 都要填'); return; }
      try { await store.addLeader(name, qq); }
      catch (e) {
        const m = String(e.message || '');
        fail((m.indexOf('duplicate') > -1 || m.indexOf('23505') > -1 || m.indexOf('已经录入') > -1) ? '这个 QQ 号已经录入过了' : m);
        return;
      }
      state.leaders = await store.listLeaders();
      state.assistants = await store.listAssistants();
      render(); return;
    }
    case 'delLeader': {
      if (!window.confirm('删除后这个组长和他名下的小助理都进不去系统了，确定？')) return;
      try { await store.delLeader(el2.dataset.id); } catch (e) { fail(e.message); return; }
      state.leaders = await store.listLeaders();
      state.assistants = await store.listAssistants();
      state.exams = await store.listExams();
      render(); return;
    }

    /* --- 组长：小助理 --- */
    case 'addAssist': {
      const name = val('naName'), qq = val('naQq');
      if (!name || !qq) { fail('名字和 QQ 都要填'); return; }
      try { await store.addAssistant(state.actor.leaderId, state.actor.leaderName, name, qq); }
      catch (e) {
        const m = String(e.message || '');
        fail((m.indexOf('duplicate') > -1 || m.indexOf('23505') > -1 || m.indexOf('已经录入') > -1) ? '这个 QQ 号已经录入过了' : m);
        return;
      }
      state.assistants = await store.listAssistants(state.actor.leaderId);
      render(); return;
    }
    case 'delAssist': {
      if (!window.confirm('确定删除这个小助理？')) return;
      try { await store.delAssistant(el2.dataset.id); } catch (e) { fail(e.message); return; }
      state.assistants = await store.listAssistants(state.actor.leaderId);
      render(); return;
    }

    /* --- 题库管理 --- */
    case 'qbankSel': state.qbank = el2.dataset.bank; state.editing = null; state.questions = await store.listQuestions(state.qbank); render(); return;
    case 'qEdit': state.editing = el2.dataset.id; render(); return;
    case 'qCancel': state.editing = null; render(); return;
    case 'qDel': {
      if (!window.confirm('删除这一道题？')) return;
      try { await store.delQuestion(el2.dataset.id); } catch (e) { fail(e.message); return; }
      state.questions = await store.listQuestions(state.qbank); render(); return;
    }
    case 'qSave': {
      const id = el2.dataset.id;
      const qtype = val('eqType'), stem = val('eqStem'), answer = val('eqAns');
      if (!stem || !answer) { fail('题干和标准答案不能空'); return; }
      const opts = val('eqOpts').split('\n').map(s => s.trim()).filter(Boolean);
      const blanks = Number(val('eqBlanks')) || 0;
      try {
        await store.updateQuestion(id, { qtype: qtype, stem: stem, options: opts, answer: answer, blanks: blanks });
      } catch (e) { fail(e.message); return; }
      state.editing = null;
      state.questions = await store.listQuestions(state.qbank); render(); return;
    }
    case 'qAdd': {
      const maxSort = state.questions.reduce((m, q) => Math.max(m, Number(q.sort) || 0), 0);
      const item = { bank: state.qbank, sort: maxSort + 1, qtype:'short', stem:'新题目（点“改这道”填写内容）', options:[], answer:'（待填写答案）', blanks:0 };
      try { await store.addQuestion(item); } catch (e) { fail(e.message); return; }
      state.questions = await store.listQuestions(state.qbank); render(); return;
    }

    /* --- 团长：密码 --- */
    case 'savePwd': {
      const p = val('newPwd');
      if (!p || p.length < 4) { fail('密码至少 4 位'); return; }
      try { await store.setSetting('owner_pwd', p); } catch (e) { fail(e.message); return; }
      fail(''); window.alert('团长密码已更新'); render(); return;
    }
    case 'saveOwnerInfo': {
      const acc = val('newAcc'), pwd = val('newPwd');
      if (!acc && !pwd) { fail('账号或密码填一个'); return; }
      if (acc && !/^[0-9]{6,12}$/.test(acc)) { fail('账号只能填 6~12 位数字 QQ 号'); return; }
      if (pwd && pwd.length < 6) { fail('密码至少 6 位'); return; }
      try {
        if (acc) await store.setSetting('owner_qq', acc);
        if (pwd) await store.setSetting('owner_pwd', pwd);
        state.settings = await store.getSettings();
      } catch (e) { fail(e.message); return; }
      fail(''); window.alert('已保存，下次登录用新的账号密码'); render(); return;
    }
    case 'filterExam': {
      state.filterLeader = el('flSel') ? el('flSel').value : '';
      state.filterPass = el('fpSel') ? el('fpSel').value : '';
      render(); return;
    }
  }
}

/* ================= 事件绑定 ================= */
document.addEventListener('click', async function (e) {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  if (act === 'filterExam') return;
  if (t.tagName === 'SELECT') return;
  try { await handle(act, t); }
  catch (err) {
    const e2 = el('err');
    if (e2) e2.textContent = err && err.message ? err.message : '出错了';
    else window.alert(err && err.message ? err.message : '出错了');
  }
});

document.addEventListener('change', function (e) {
  const t = e.target.closest('[data-act="filterExam"]');
  if (t) {
    state.filterLeader = el('flSel') ? el('flSel').value : '';
    state.filterPass = el('fpSel') ? el('fpSel').value : '';
    render();
  }
});

document.addEventListener('input', function (e) {
  const t = e.target;
  if (!state.exam) return;
  if (t.getAttribute('data-ans-i') !== null) {
    const i = Number(t.getAttribute('data-ans-i'));
    const jAttr = t.getAttribute('data-ans-j');
    if (jAttr !== null) {
      const j = Number(jAttr);
      const arr = Array.isArray(state.exam.answers[i]) ? state.exam.answers[i] : [];
      arr[j] = t.value; state.exam.answers[i] = arr;
    } else {
      state.exam.answers[i] = t.value;
    }
    updateProg();
  }
});
